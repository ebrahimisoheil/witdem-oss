version: 1
service:
  name: routing-agent
  runtime: openai-agents
telemetry:
  capture_content: false
contracts:
  routed_request:
    mode: expression
    description: Route a request to automation or human review.
    application_outcome:
      status: $.route
    artifact:
      name: Routing result
      valid:
        exists: $.route
    decision:
      name: Request route
      outcomes:
        automated: The application handled the request.
        escalated: A person must review the request.
      expected: $.expected_route
      observed: $.route
      reason: $.routing_reason
    product_goal:
      name: Correct request routing
      description: Select the expected route and provide a routing result.
      achieved:
        all:
          - $.witdem.artifact_valid
          - $.witdem.decision_correct
      closest_blocker:
        choose:
          when: $.witdem.decision_correct
          then: none
          else: unexpected route
    metrics:
      - name: Routing confidence
        description: Confidence reported by the routing policy.
        value: $.confidence
        unit: ratio
