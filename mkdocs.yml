site_name: Witdem Documentation
site_description: Local-first analytics for AI agents and multi-step AI applications.
site_url: https://docs.witdem.com/
repo_url: https://github.com/ebrahimisoheil/witdem-oss
repo_name: ebrahimisoheil/witdem-oss
edit_uri: edit/main/docs/
copyright: Copyright &copy; Witdem contributors

theme:
  name: material
  logo: assets/witdem-banner.png
  favicon: assets/witdem-banner.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Get started:
      - Installation and first run: getting-started.md
      - Concepts: concepts.md
      - Configuration: configuration.md
      - Examples: examples.md
  - Instrumentation:
      - SDK: sdk.md
      - YAML contracts: contract-tutorial.md
      - Providers: providers.md
      - Frameworks:
          - Native Python: integrations/native-python.md
          - Haystack: integrations/haystack.md
          - LangGraph: integrations/langgraph.md
          - LangChain: integrations/langchain.md
          - OpenAI Agents: integrations/openai-agents.md
          - Anthropic and Claude Agent SDK: integrations/anthropic.md
          - LiteLLM: integrations/litellm.md
          - smolagents: integrations/smolagents.md
      - Provider guides:
          - OpenAI: providers/openai.md
          - Azure OpenAI: providers/azure-openai.md
          - Anthropic: providers/anthropic.md
          - DeepSeek: providers/deepseek.md
          - Mistral: providers/mistral.md
          - Bedrock: providers/bedrock.md
          - Vertex AI: providers/vertex-ai.md
          - Ollama: providers/ollama.md
          - Cohere: providers/cohere.md
          - OpenRouter: providers/openrouter.md
  - Workflows:
      - Workflow replay: workflow-replay.md
      - Dashboard: dashboard.md
  - Operate:
      - Operations: operations.md
      - CLI reference: cli-reference.md
      - npm launcher: npm-launcher.md
      - Upgrade: upgrade.md
      - Troubleshooting: troubleshooting.md
  - Reference:
      - Architecture: architecture.md
      - Pricing and cost attribution: pricing.md
      - Development: development.md
      - Changelog: changelog.md

exclude_docs: |
  implementation-report.md

not_in_nav: |
  implementation-report.md
  contracts/*.yaml

validation:
  omitted_files: warn
  absolute_links: relative_to_docs
  unrecognized_links: warn
