version: 1
service:
  name: witdem-example-cloud-bedrock
  runtime: cloud/bedrock
telemetry:
  capture_content: false
contracts:
  - name: answer
    mode: expression
    description: Return one useful Amazon Bedrock answer.
    application_outcome:
      status:
        choose:
          when:
            non_empty: $.answer
          then: completed
          else: unresolved
    artifact:
      name: Agent answer
      description: The answer returned to the user.
      valid:
        non_empty: $.answer
    decision:
      name: Result validity
      expected: true
      observed: $.witdem.artifact_valid
    product_goal:
      name: Useful answer returned
      description: Give the user a non-empty answer.
      achieved: $.witdem.artifact_valid
      closest_blocker:
        choose:
          when: $.witdem.artifact_valid
          then: none
          else: empty answer
    metrics:
      - name: Answer characters
        value:
          length: $.answer
        unit: characters
