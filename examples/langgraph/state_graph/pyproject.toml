[project]
name = "witdem-example-langgraph-state-graph"
version = "0.1.0"
description = "Standalone Witdem integration example"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1,<2",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "langgraph>=0.2,<2",
  "witdem-sdk[langgraph]",
]

[tool.uv]
package = false
required-version = "==0.9.10"
[tool.uv.sources]
witdem-sdk = { path = "../../../witdem-sdk", editable = true }
[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
