[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "witdem-product-factory-example"
version = "0.1.0"
description = "Product Factory reference workload for Witdem"
readme = { text = "Controlled multi-runtime reference workload for Witdem Analytics.", content-type = "text/markdown" }
requires-python = ">=3.12,<3.14"
dependencies = [
  "witdem-sdk",
  "httpx>=0.27,<1",
  "opentelemetry-sdk",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3,<2"]
langgraph = ["langgraph>=0.2,<1"]
haystack = ["haystack-ai>=3.0,<4", "opentelemetry-haystack>=1,<2"]
openai-agents = ["openai-agents>=0.0.10,<1"]
anthropic = ["anthropic>=0.50,<1"]
all = [
  "langchain-core>=0.3,<2",
  "langgraph>=0.2,<1",
  "haystack-ai>=3.0,<4",
  "opentelemetry-haystack>=1,<2",
  "openai-agents>=0.0.10,<1",
  "anthropic>=0.50,<1",
]

[tool.uv]
required-version = "==0.12.5"

[tool.uv.sources]
witdem-sdk = { path = "../../witdem-sdk", editable = true }

[project.scripts]
product-factory = "product_factory_app.cli:research_command"

[tool.hatch.build.targets.wheel]
packages = ["src/product_factory_app"]
exclude = ["src/product_factory_app/experiments/**"]

[tool.hatch.build.targets.wheel.force-include]
"cases" = "product_factory_app/reference/case_data"

[tool.hatch.build.targets.sdist]
include = ["src/product_factory_app", "cases", "pyproject.toml"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.15,<2",
  "httpx>=0.27,<1",
  "types-PyYAML>=6,<7",
  "pyarrow>=18,<23",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = ["unit: deterministic unit tests", "integration: boundary tests", "e2e: deterministic end-to-end tests", "live: provider tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
