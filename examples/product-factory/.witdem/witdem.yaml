version: 1
service:
  name: witdem-product-factory
  description: Qualifies companies from controlled evidence using multiple agent runtimes.
  runtime: product-factory
telemetry:
  capture_content: false
contracts:
  - name: company_qualification
    mode: reported
    description: Research one company and decide whether it qualifies, should be rejected, or needs escalation.
    result:
      name: Qualification outcome
      description: The evidence-backed result returned by the qualification workflow.
      values:
        accepted:
          description: The company qualifies.
          tone: success
        rejected:
          description: The company does not qualify.
          tone: failure
        escalated:
          description: The evidence is too close or ambiguous for an automatic decision.
          tone: warning
    decision:
      name: Company qualification
      description: The final deterministic qualification decision.
      values:
        accepted:
          description: The company qualifies.
          tone: success
        rejected:
          description: The company does not qualify.
          tone: failure
        escalated:
          description: The evidence is too close or ambiguous for an automatic decision.
          tone: warning
    product_goal:
      name: Correct company qualification
      description: Reach the expected, evidence-supported qualification outcome through the required workflow path.
    dimensions:
      case_id:
        name: Evidence case
      runtime_id:
        name: Agent runtime
      model_profile:
        name: Model profile
    metrics:
      qualification_score:
        name: Qualification score
        description: Weighted evidence-backed qualification score.
        unit: score
