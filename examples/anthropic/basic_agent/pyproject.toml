[project]
name = "witdem-example-anthropic-basic-agent"
version = "0.1.0"
description = "Standalone Witdem integration example"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1,<2",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "anthropic>=0.50,<1",
]

[tool.uv]
package = false
[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
