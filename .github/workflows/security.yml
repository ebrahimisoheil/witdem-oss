name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "31 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22.16.0"
  NPM_VERSION: "11.19.1"
  UV_VERSION: "0.12.5"
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"
      - run: python -m pip_audit --requirement constraints/production.txt
      - name: Audit SDK base dependencies
        run: |
          uv export --project witdem-sdk --frozen --no-dev --no-emit-project --no-hashes --output-file /tmp/sdk-requirements.txt
          python -m pip_audit --requirement /tmp/sdk-requirements.txt

  npm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [npm, web]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "npm@${NPM_VERSION}"
      - run: npm audit --package-lock-only --audit-level=high
