name: Release Witdem platform

on:
  push:
    tags: ["analytics-v*"]

permissions:
  contents: write
  id-token: write
  packages: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22.16.0"
  NPM_VERSION: "11.19.1"
  UV_VERSION: "0.12.5"
  PIP_VERSION: "26.2.1"
  BUILD_VERSION: "1.5.0"
  TWINE_VERSION: "7.0.0"

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      sdk_version: ${{ steps.release.outputs.sdk_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        run: |
          python scripts/release/verify.py --component platform --tag "$GITHUB_REF_NAME" --require-clean
          version=$(python -c 'import json; print(json.load(open("release.json"))["platform_version"])')
          sdk_version=$(python -c 'import json; print(json.load(open("release.json"))["sdk_version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sdk_version=$sdk_version" >> "$GITHUB_OUTPUT"
      - run: python scripts/release/check_pypi.py witdem-analytics "${{ steps.release.outputs.version }}"
      - run: python scripts/release/check_pypi.py witdem-sdk "${{ steps.release.outputs.sdk_version }}" --must-exist
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - run: npm install --global "npm@${NPM_VERSION}"
      - name: Refuse an existing npm version
        run: |
          if npm view "witdem@${{ steps.release.outputs.version }}" version >/dev/null 2>&1; then
            echo "Refusing version reuse: witdem@${{ steps.release.outputs.version }} already exists." >&2
            exit 1
          fi
      - name: Refuse an existing container tag
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/witdem-analytics:${{ steps.release.outputs.version }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Refusing version reuse: $IMAGE already exists." >&2
            exit 1
          fi

  publish-python:
    needs: preflight
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global "npm@${NPM_VERSION}"
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Verify committed dashboard artifacts
        run: git diff --exit-code -- src/witdem/dashboard/static
      - run: uv sync --all-groups --locked
      - run: uv run pytest -q
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - name: Verify production constraints
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --no-header --no-annotate --output-file /tmp/production.txt
          diff -u constraints/production.txt /tmp/production.txt
      - run: python -m pip install "pip==${PIP_VERSION}" "build==${BUILD_VERSION}" "twine==${TWINE_VERSION}"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/witdem-wheel
          /tmp/witdem-wheel/bin/pip install dist/*.whl
          /tmp/witdem-wheel/bin/witdem version
          /tmp/witdem-wheel/bin/witdem doctor --port 14318 --dashboard-port 18501
      - name: pipx native clean-start release gate
        run: |
          python -m pip install pipx
          export PIPX_HOME="$RUNNER_TEMP/pipx-home"
          export PIPX_BIN_DIR="$RUNNER_TEMP/pipx-bin"
          export WITDEM_UPDATE_CHECK=0
          data_dir="$RUNNER_TEMP/witdem-native-data"
          python -m pipx install --backend pip dist/*.whl
          "$PIPX_BIN_DIR/witdem" up --no-open --data-dir "$data_dir" --receiver-port 14328 --dashboard-port 18511
          "$PIPX_BIN_DIR/witdem" status --data-dir "$data_dir" --receiver-port 14328 --dashboard-port 18511 --json
          curl -fsS -X POST http://127.0.0.1:14328/sdk/v1/records \
            -H 'content-type: application/json' \
            -d '{"version":"1.0","kind":"outcome","event_id":"native-smoke-event","execution_id":"native-smoke","name":"execution.completed","value":"success","attributes":{"runtime_id":"native-smoke"}}'
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:14328/ingestion/v1/executions/native-smoke | grep -q '"status":"ready"' && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18511/api/v1/runs/native-smoke >/dev/null
          "$PIPX_BIN_DIR/witdem" logs --data-dir "$data_dir" receiver >/dev/null
          cp "$data_dir/run/services.json" "$RUNNER_TEMP/native-pids.json"
          "$PIPX_BIN_DIR/witdem" down --data-dir "$data_dir" --receiver-port 14328 --dashboard-port 18511
          "$PIPX_BIN_DIR/witdem" up --no-open --data-dir "$data_dir" --receiver-port 14328 --dashboard-port 18511
          curl -fsS http://127.0.0.1:18511/api/v1/runs/native-smoke >/dev/null
          "$PIPX_BIN_DIR/witdem" down --data-dir "$data_dir" --receiver-port 14328 --dashboard-port 18511
          python - <<'PY'
          import json, os
          from pathlib import Path
          state = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("native-pids.json").read_text())
          for service in state["services"].values():
              try:
                  os.kill(int(service["pid"]), 0)
              except OSError:
                  continue
              raise SystemExit(f"orphan Witdem process: {service['pid']}")
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-container-and-npm:
    needs: [preflight, publish-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.witdem
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/witdem-analytics:${{ needs.preflight.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/witdem-analytics:sha-${{ github.sha }}
      - name: Compose smoke test published image
        env:
          WITDEM_ANALYTICS_IMAGE: ghcr.io/${{ github.repository_owner }}/witdem-analytics:${{ needs.preflight.outputs.version }}
        run: |
          docker compose pull witdem elt-worker dashboard
          docker compose up -d --no-build
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:4318/readiness && curl -fsS http://localhost:8501/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - run: npm install --global "npm@${NPM_VERSION}"
      - name: Test npm launcher
        working-directory: npm
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          npm pack --silent > "$RUNNER_TEMP/npm-tarball-name"
      - name: Confirm the matching public image is pullable
        run: |
          docker logout ghcr.io
          docker manifest inspect ghcr.io/${{ github.repository_owner }}/witdem-analytics:${{ needs.preflight.outputs.version }} >/dev/null
      - name: NPX Docker clean-start release gate
        env:
          WITDEM_UPDATE_CHECK: "0"
        run: |
          tarball="npm/$(cat "$RUNNER_TEMP/npm-tarball-name")"
          data_dir="$RUNNER_TEMP/witdem-npx-data"
          package="file:$PWD/$tarball"
          args="--image ghcr.io/${{ github.repository_owner }}/witdem-analytics:${{ needs.preflight.outputs.version }} --project-name witdem-release-smoke --data-dir $data_dir --receiver-port 14338 --dashboard-port 18521"
          npx --yes --package "$package" witdem up --no-open $args
          npx --yes --package "$package" witdem status --json $args
          curl -fsS -X POST http://127.0.0.1:14338/sdk/v1/records \
            -H 'content-type: application/json' \
            -d '{"version":"1.0","kind":"outcome","event_id":"npx-smoke-event","execution_id":"npx-smoke","name":"execution.completed","value":"success","attributes":{"runtime_id":"npx-smoke"}}'
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:14338/ingestion/v1/executions/npx-smoke | grep -q '"status":"ready"' && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18521/api/v1/runs/npx-smoke >/dev/null
          npx --yes --package "$package" witdem logs receiver $args >/dev/null
          npx --yes --package "$package" witdem down $args
          npx --yes --package "$package" witdem up --no-open $args
          curl -fsS http://127.0.0.1:18521/api/v1/runs/npx-smoke >/dev/null
          npx --yes --package "$package" witdem down $args
          test -z "$(docker ps -q --filter label=com.docker.compose.project=witdem-release-smoke)"
      - name: Publish npm launcher
        working-directory: npm
        run: npm publish --access public

  publish-release-manifest:
    needs: [preflight, publish-python, publish-container-and-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --no-dev
      - name: Verify all public artifacts before manifest publication
        run: |
          python scripts/release/check_pypi.py witdem-analytics "${{ needs.preflight.outputs.version }}" --must-exist
          python scripts/release/check_pypi.py witdem-sdk "${{ needs.preflight.outputs.sdk_version }}" --must-exist
          npm view "witdem@${{ needs.preflight.outputs.version }}" version
          docker manifest inspect "ghcr.io/${{ github.repository_owner }}/witdem-analytics:${{ needs.preflight.outputs.version }}" >/dev/null
      - name: Build signed release manifest
        env:
          WITDEM_RELEASE_SIGNING_KEY: ${{ secrets.WITDEM_RELEASE_SIGNING_KEY }}
        run: |
          uv run python scripts/release/build_manifest.py \
            --repository "${{ github.repository }}" \
            --output witdem-release.json
      - name: Publish authoritative manifest last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" witdem-release.json --clobber
