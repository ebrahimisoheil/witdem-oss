name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build documentation image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.docs
          load: true
          tags: witdem-docs:test
      - name: Smoke-test the documentation service
        run: |
          docker run --detach --name witdem-docs-test --publish 127.0.0.1:3010:8080 witdem-docs:test
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3010/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3010/ >/dev/null
          curl -fsS http://127.0.0.1:3010/api/analytics/ >/dev/null
          curl -fsS http://127.0.0.1:3010/openapi/analytics.json >/dev/null
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish documentation image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.docs
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/witdem-docs:latest
            ghcr.io/${{ github.repository_owner }}/witdem-docs:sha-${{ github.sha }}
