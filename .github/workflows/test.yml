name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  npm-launcher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - run: npm install --global npm@11.4.1
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
      - name: Validate the packaged Compose definition
        env:
          WITDEM_IMAGE: ghcr.io/ebrahimisoheil/witdem-analytics:0.3.0
          WITDEM_RECEIVER_PORT: "4318"
          WITDEM_DASHBOARD_PORT: "8501"
        run: docker compose --file compose.yaml config --quiet

  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.10"
          python-version: ${{ matrix.python }}
      - run: uv sync --all-groups --locked
      - run: uv run pytest -q
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv sync --project witdem-sdk --all-groups --locked
      - run: uv run pytest -q
        working-directory: witdem-sdk
      - run: uv run ruff check src tests
        working-directory: witdem-sdk
      - run: uv run mypy src
        working-directory: witdem-sdk

  product-factory:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/product-factory
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.10"
          python-version: "3.12"
      - run: uv sync --all-groups --all-extras --locked
      - name: Install analytics package used by internal experiment tests
        run: uv pip install --python .venv/bin/python -e ../..
      - run: uv run pytest -q
      - run: uv run ruff check src tests
      - run: uv run mypy src

  sdk-extras:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [anthropic, openai, langchain, langgraph, haystack, all]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.10"
          python-version: "3.12"
      - run: uv venv /tmp/witdem-extra
      - run: uv pip install --python /tmp/witdem-extra/bin/python "./witdem-sdk[${{ matrix.extra }}]"
      - name: Import selected integration
        run: |
          case "${{ matrix.extra }}" in
            openai) module=openai_agents ;;
            all) module=anthropic ;;
            *) module="${{ matrix.extra }}" ;;
          esac
          /tmp/witdem-extra/bin/python -c "import witdem_sdk; import witdem_sdk.integrations.${module}"

  sdk-integrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: witdem-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.10"
          python-version: "3.12"
      - run: uv sync --all-groups --all-extras --locked
      - run: uv run pytest -q tests/test_optional_integrations.py

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@11.4.1
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Verify committed dashboard artifacts
        working-directory: .
        run: git diff --exit-code -- src/witdem/dashboard/static
