name: Release witdem-sdk

on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.12.5"
  PIP_VERSION: "26.2.1"
  BUILD_VERSION: "1.5.0"
  TWINE_VERSION: "7.0.0"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: witdem-sdk
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify release identity
        working-directory: .
        run: python scripts/release/verify.py --component sdk --tag "$GITHUB_REF_NAME" --require-clean
      - name: Refuse an existing PyPI version
        working-directory: .
        run: |
          version=$(python -c 'import json; print(json.load(open("release.json"))["sdk_version"])')
          python scripts/release/check_pypi.py witdem-sdk "$version"
      - run: uv sync --all-groups --all-extras --locked
      - run: uv run pytest -q
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: python -m pip install "pip==${PIP_VERSION}" "build==${BUILD_VERSION}" "twine==${TWINE_VERSION}"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test built wheel and CLI ownership
        run: |
          python -m venv /tmp/witdem-sdk-wheel
          /tmp/witdem-sdk-wheel/bin/pip install dist/*.whl
          test -x /tmp/witdem-sdk-wheel/bin/witdem-sdk
          test ! -e /tmp/witdem-sdk-wheel/bin/witdem
          /tmp/witdem-sdk-wheel/bin/witdem-sdk --help
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: witdem-sdk/dist
