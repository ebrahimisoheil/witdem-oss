[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "witdem-analytics"
version = "0.2.4"
description = "Runtime analytics for agent applications using OpenTelemetry, with optional business semantics through the Witdem SDK."
readme = "README.md"
requires-python = ">=3.10,<3.14"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "cryptography>=50,<51",
  "duckle==0.5.11",
  "duckdb>=1.2,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "opentelemetry-proto>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "pydantic>=2.10,<3",
  "platformdirs>=4.3,<5",
  "filelock>=3.16,<4",
  "pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
witdem = "witdem.cli:main"

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "mypy>=1.15,<2",
  "numpy>=2,<2.3",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "tomli>=2.2,<3; python_version < '3.11'",
  "types-PyYAML>=6.0,<7",
]
[tool.hatch.build.targets.wheel]
packages = ["src/witdem"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src",
]

[tool.uv]
required-version = "==0.12.5"

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = ["unit: deterministic unit tests", "integration: live boundary tests", "e2e: end-to-end tests"]
filterwarnings = [
  "error:The 'app' shortcut is now deprecated.*:DeprecationWarning",
  "error::DeprecationWarning:httpx.*",
  "error::DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["witdem"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[tool.ruff.lint.per-file-ignores]
"src/witdem/analytics/schema.py" = ["E501"]
"src/witdem/analytics/__init__.py" = ["E501"]
"src/witdem/analytics/repository/analytics_repository.py" = ["B008"]
"examples/product-factory/src/product_factory_app/experiments/report.py" = ["E501"]
"examples/product-factory/src/product_factory_app/experiments/haystack_compatibility.py" = ["E501"]
"examples/product-factory/src/product_factory_app/experiments/synthetic_corpus.py" = ["E501"]
